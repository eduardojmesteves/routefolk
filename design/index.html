<!doctype html>
<html lang="en-GB" data-palette="forest">
<head>
  <meta charset="utf-8">
  <title>Routefolk · Field journal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ebe5d3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="rf-app">
  <main id="rf-screen" class="rf-screen" aria-live="polite"></main>

  <nav class="rf-tabbar" role="tablist" aria-label="Primary">
    <a href="#/trips"   class="rf-tab" data-tab="trips"   role="tab"><span class="rf-tab__bar"></span><span class="rf-tab__label">Trips</span></a>
    <a href="#/archive" class="rf-tab" data-tab="archive" role="tab"><span class="rf-tab__bar"></span><span class="rf-tab__label">Archive</span></a>
    <a href="#/account" class="rf-tab" data-tab="account" role="tab"><span class="rf-tab__bar"></span><span class="rf-tab__label">You</span></a>
  </nav>

  <!-- Palette switcher (PWA setting; could be moved to /account in production) -->
  <button class="rf-paletteFab" id="rf-paletteFab" aria-label="Change palette" aria-expanded="false">
    <span class="rf-paletteFab__dot rf-paletteFab__dot--primary"></span>
    <span class="rf-paletteFab__dot rf-paletteFab__dot--accent"></span>
  </button>
  <div class="rf-paletteSheet" id="rf-paletteSheet" role="dialog" aria-label="Choose palette" hidden>
    <div class="rf-paletteSheet__kicker">Palette</div>
    <div class="rf-paletteSheet__title">Field journal · colours</div>
    <div class="rf-paletteSheet__list">
      <button class="rf-paletteOpt" data-palette="forest">
        <span class="rf-paletteOpt__swatch" style="--a:#355d3f;--b:#b3823a;--c:#ebe5d3"></span>
        <span class="rf-paletteOpt__name">Forest &amp; Ochre</span>
        <span class="rf-paletteOpt__sub">Warm cream · forest · ochre</span>
      </button>
      <button class="rf-paletteOpt" data-palette="midnight">
        <span class="rf-paletteOpt__swatch" style="--a:#26345e;--b:#b85a2e;--c:#e7e4d8"></span>
        <span class="rf-paletteOpt__name">Ink &amp; Rust</span>
        <span class="rf-paletteOpt__sub">Cool cream · ink · rust</span>
      </button>
      <button class="rf-paletteOpt" data-palette="oxblood">
        <span class="rf-paletteOpt__swatch" style="--a:#566970;--b:#8a4554;--c:#ece7df"></span>
        <span class="rf-paletteOpt__name">Slate &amp; Bordeaux</span>
        <span class="rf-paletteOpt__sub">Warm white · slate · bordeaux</span>
      </button>
      <button class="rf-paletteOpt" data-palette="alpine">
        <span class="rf-paletteOpt__swatch" style="--a:#2c3133;--b:#c69842;--c:#e9e6dd"></span>
        <span class="rf-paletteOpt__name">Graphite &amp; Sun</span>
        <span class="rf-paletteOpt__sub">Soft beige · graphite · sun</span>
      </button>
    </div>
  </div>
</div>

<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
