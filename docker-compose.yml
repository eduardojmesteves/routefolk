name: routefolk

services:
  db:
    image: supabase/postgres:15.8.1.060
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routefolk-local-password}
      POSTGRES_DB: postgres
    volumes:
      - routefolk-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.177.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://127.0.0.1:18080}
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-routefolk-local-password}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:8788}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL:-http://localhost:8788}/*
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL:-http://127.0.0.1:18080}/auth/v1/callback
      GOTRUE_MAILER_AUTOCONFIRM: ${MAILER_AUTOCONFIRM:-true}

  rest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-routefolk-local-password}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}

  storage:
    image: supabase/storage-api:v1.25.7
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzAwMDAwMDAwLCJleHAiOjIwMTUzNjAwMDB9.signature-replace-me}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:-replace-with-a-valid-service-role-jwt}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD:-routefolk-local-password}@db:5432/postgres
      FILE_SIZE_LIMIT: 8388608
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      GLOBAL_S3_BUCKET: stub
    volumes:
      - routefolk-storage:/var/lib/storage

  migrate:
    image: postgres:15-alpine
    depends_on:
      auth:
        condition: service_started
      storage:
        condition: service_started
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-routefolk-local-password}
    volumes:
      - ./schema.sql:/schema.sql:ro
      - ./infrastructure/docker/migrate.sh:/migrate.sh:ro
      - ./migrations:/migrations:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    restart: "no"

  agent-api:
    build: ./services/agent-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-routefolk-local-password}@db:5432/postgres
      AGENT_API_KEY: ${AGENT_API_KEY:-change-me-before-exposing}
      AGENT_USER_ID: ${AGENT_USER_ID:-00000000-0000-4000-8000-000000000001}
      PORT: 3001

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      agent-api:
        condition: service_started
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-18080}:80"
    volumes:
      - ./infrastructure/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  routefolk-db:
  routefolk-storage:
