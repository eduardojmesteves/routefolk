<!DOCTYPE html>
<html lang="en-GB" data-palette="midnight">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#171a26">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="routefolk">
  <meta name="description" content="Plan, journal, and archive motorcycle trips with friends.">
  <meta name="color-scheme" content="light">
  <title>routefolk</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260515-ui-reset-phase22-stabilisation">
</head>
<body>
  <a class="skip-link" href="#content">Skip to main content</a>
  <div class="rf-app" id="app">
    <nav class="rf-tabbar" id="nav" role="tablist" aria-label="Primary navigation"></nav>
    <div class="rf-main" id="rf-main">
      <aside class="rf-list-pane" id="trips-pane" aria-hidden="true"></aside>
      <main class="rf-screen" id="content" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>
  <div id="toast" aria-live="polite" aria-atomic="true"></div>
  <button class="rf-paletteFab" id="rf-paletteFab" aria-label="Change palette" type="button">
    <span class="rf-paletteFab__dot rf-paletteFab__dot--primary"></span>
    <span class="rf-paletteFab__dot rf-paletteFab__dot--accent"></span>
  </button>
  <div class="rf-paletteSheet" id="rf-paletteSheet" hidden>
    <div class="rf-paletteSheet__kicker">Palette</div>
    <div class="rf-paletteSheet__title">Field journal · colours</div>
    <div class="rf-paletteSheet__list">
      <button class="rf-paletteOpt" data-palette="forest" type="button"><span>Forest & Ochre</span><small>Green map, ochre light</small></button>
      <button class="rf-paletteOpt" data-palette="midnight" type="button"><span>Ink & Rust</span><small>Ink paper, rust details</small></button>
      <button class="rf-paletteOpt" data-palette="oxblood" type="button"><span>Slate & Bordeaux</span><small>Slate roads, wine stamps</small></button>
      <button class="rf-paletteOpt" data-palette="alpine" type="button"><span>Graphite & Sun</span><small>Grey field notes, yellow signal</small></button>
    </div>
  </div>
  <script src="app.js?v=20260515-ui-reset-phase22-stabilisation" type="module"></script>
</body>
</html>
