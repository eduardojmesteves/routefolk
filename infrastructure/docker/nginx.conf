log_format routefolk_api '$remote_addr - $remote_user [$time_local] \"$request\" '
                           '$status $body_bytes_sent \"$http_referer\" '
                           '\"$http_user_agent\" rt=$request_time '
                           'xff=\"$http_x_forwarded_for\"';

limit_req_zone $binary_remote_addr zone=routefolk_api:10m rate=$ROUTEFOLK_API_RATE_LIMIT_RATE;

map $http_x_forwarded_proto $routefolk_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

map $http_origin $routefolk_cors_origin {
  default "";
  "$ROUTEFOLK_SITE_URL" $http_origin;
}

server {
  listen 80;
  server_name _;

  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;
  add_header Access-Control-Allow-Origin $routefolk_cors_origin always;
  add_header Access-Control-Allow-Credentials "true" always;
  add_header Access-Control-Allow-Headers "accept-profile, apikey, authorization, content-profile, content-type, prefer, range, x-client-info, x-supabase-api-version, x-upsert" always;
  add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
  add_header Access-Control-Expose-Headers "content-location, content-range, location, range-unit" always;
  add_header Vary Origin always;

  if ($request_method = OPTIONS) {
    return 204;
  }

  # Report application/database readiness rather than merely proving that
  # Nginx itself is running.
  location = /health {
    proxy_pass http://api:3001/health;
    proxy_set_header Host $host;
  }
  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $routefolk_forwarded_proto;
  }
  location /rest/v1/ { proxy_pass http://rest:3000/; proxy_set_header Host $host; }
  location /storage/v1/ { proxy_pass http://storage:5000/; proxy_set_header Host $host; }
  location /api/v1/ {
    limit_req zone=routefolk_api burst=$ROUTEFOLK_API_RATE_LIMIT_BURST nodelay;
    limit_req_status 429;
    access_log /dev/stdout routefolk_api;

    proxy_pass http://api:3001/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $routefolk_forwarded_proto;
  }
  location = /mcp {
    limit_req zone=routefolk_api burst=$ROUTEFOLK_API_RATE_LIMIT_BURST nodelay;
    limit_req_status 429;
    access_log /dev/stdout routefolk_api;
    proxy_buffering off;

    proxy_pass http://api:3001/mcp;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $routefolk_forwarded_proto;
  }
  location / { return 404; }
}
