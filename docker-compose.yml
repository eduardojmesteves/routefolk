name: routefolk

services:
  db:
    image: supabase/postgres:15.8.1.060
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./infrastructure/docker/setup-env.sh first}
      POSTGRES_DB: postgres
    volumes:
      - routefolk-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  bootstrap:
    image: postgres:15-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./infrastructure/docker/bootstrap-db.sh:/bootstrap-db.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap-db.sh"]
    restart: "no"

  auth:
    image: supabase/gotrue:v2.177.0
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://127.0.0.1:18080}
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:8788}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL:-http://localhost:8788}/*,${API_EXTERNAL_URL:-http://127.0.0.1:18080}/*
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL:-http://127.0.0.1:18080}/auth/v1/callback
      GOTRUE_MAILER_AUTOCONFIRM: ${MAILER_AUTOCONFIRM:-true}

  rest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}

  storage:
    image: supabase/storage-api:v1.25.7
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY:?ANON_KEY is required}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?SERVICE_ROLE_KEY is required}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/postgres
      FILE_SIZE_LIMIT: 8388608
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      GLOBAL_S3_BUCKET: stub
    volumes:
      - routefolk-storage:/var/lib/storage

  migrate:
    image: postgres:15-alpine
    depends_on:
      auth:
        condition: service_started
      storage:
        condition: service_started
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./schema.sql:/schema.sql:ro
      - ./infrastructure/docker/migrate.sh:/migrate.sh:ro
      - ./migrations:/migrations:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    restart: "no"

  api:
    build: ./services/api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/postgres
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://127.0.0.1:18080}
      ROUTEFOLK_API_KEY: ${ROUTEFOLK_API_KEY:?ROUTEFOLK_API_KEY is required}
      ROUTEFOLK_API_USER_ID: ${ROUTEFOLK_API_USER_ID:?Set ROUTEFOLK_API_USER_ID to an existing approved Auth user UUID}
      PORT: 3001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-18080}:80"
    environment:
      ROUTEFOLK_SITE_URL: ${SITE_URL:-http://localhost:8788}
      ROUTEFOLK_API_RATE_LIMIT_RATE: ${API_RATE_LIMIT_RATE:-30r/m}
      ROUTEFOLK_API_RATE_LIMIT_BURST: ${API_RATE_LIMIT_BURST:-10}
      NGINX_ENVSUBST_FILTER: ROUTEFOLK_
    volumes:
      - ./infrastructure/docker/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  routefolk-db:
  routefolk-storage:
