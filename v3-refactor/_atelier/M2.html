<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M2 · stage action footer — reference render</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* canonical tokens — styles/shell.css :root, midnight (default) */
  :root{
    --rf-m2-bg:#e7e4d8;--rf-m2-surface:#f3f0e4;--rf-m2-surface-2:#e1ddd0;
    --rf-m2-ink:#171a26;--rf-m2-ink-2:#3b405a;--rf-m2-muted:#787a8a;
    --rf-m2-rule:rgba(23,26,38,.10);--rf-m2-rule-2:rgba(23,26,38,.20);
    --rf-m2-primary:#26345e;--rf-m2-accent:#b85a2e;
    --rf-m2-danger:#7d3458;            /* added by F0 */
    --rf-m2-font-ui:'Inter Tight',-apple-system,system-ui,sans-serif;
    --rf-m2-font-serif:'Newsreader',Georgia,serif;
    --rf-m2-font-mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--rf-m2-bg);font-family:var(--rf-m2-font-ui);color:var(--rf-m2-ink);
    padding:26px;display:flex;flex-direction:column;gap:18px;width:380px}
  .cap{font:600 9px var(--rf-m2-font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--rf-m2-accent);margin:4px 0 -6px}

  /* M1 card wrapper + tap body (context) */
  .rf-clean-stage-card{background:var(--rf-m2-surface);border:1px solid var(--rf-m2-rule);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
  .rf-clean-stage-tap{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:10px 12px;align-items:start;width:100%;background:transparent;border:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
  .rf-clean-stage-tap>span:first-child{font:italic 14px var(--rf-m2-font-serif);color:var(--rf-m2-accent);padding-top:1px}
  .rf-clean-stage-tap strong{font:500 13.5px var(--rf-m2-font-serif);color:var(--rf-m2-ink);display:block;line-height:1.3}
  .rf-clean-stage-tap strong em{font-style:italic;color:var(--rf-m2-muted);font-weight:400}
  .rf-clean-stage-tap small{font:10.5px var(--rf-m2-font-ui);color:var(--rf-m2-muted);display:block;margin-top:2px}

  /* M2 footer — the atom under test */
  .rf-clean-stage-foot{display:grid;grid-template-columns:40px 40px 1fr 1fr;border-top:1px solid var(--rf-m2-rule);background:rgba(0,0,0,.025)}
  .rf-clean-stage-foot button{appearance:none;border:0;background:transparent;font:600 12px var(--rf-m2-font-ui);color:var(--rf-m2-ink);padding:9px 0;border-right:1px dotted var(--rf-m2-rule);cursor:pointer;letter-spacing:.01em}
  .rf-clean-stage-foot button:last-child{border-right:0}
  .rf-clean-stage-foot button.icon{font-size:13px;color:var(--rf-m2-muted);padding:8px 0}
  .rf-clean-stage-foot button.danger{color:var(--rf-m2-danger)}
  .rf-clean-stage-foot button[disabled]{color:var(--rf-m2-rule-2);cursor:not-allowed}
  .rf-clean-stage-foot button.danger[disabled]{color:rgba(125,52,88,.35)}
</style>
</head>
<body>
  <div class="cap">default · active · online — first row (↑ disabled)</div>
  <article class="rf-clean-stage-card">
    <button class="rf-clean-stage-tap"><span>1</span><div><strong>Porto <em>to</em> Braga</strong><small>Fri · 64 km · 22 May 2026</small></div></button>
    <div class="rf-clean-stage-foot">
      <button class="icon" disabled>↑</button>
      <button class="icon">↓</button>
      <button>Edit</button>
      <button class="danger">Delete</button>
    </div>
  </article>

  <div class="cap">offline — all actions disabled</div>
  <article class="rf-clean-stage-card">
    <button class="rf-clean-stage-tap"><span>2</span><div><strong>Braga <em>to</em> Gerês</strong><small>Sat · 48 km · 23 May 2026</small></div></button>
    <div class="rf-clean-stage-foot">
      <button class="icon" disabled>↑</button>
      <button class="icon" disabled>↓</button>
      <button disabled>Edit</button>
      <button class="danger" disabled>Delete</button>
    </div>
  </article>

  <div class="cap">archived — view-only, no footer rendered</div>
  <article class="rf-clean-stage-card">
    <button class="rf-clean-stage-tap"><span>3</span><div><strong>Gerês <em>to</em> Porto</strong><small>Sun · 71 km · 24 May 2026</small></div></button>
  </article>
</body>
</html>
