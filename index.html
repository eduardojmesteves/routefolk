<body>
  <div id="app">

      <div class="hdr-left">
        <div class="hdr-kicker" id="hdrKicker">routefolk</div>
        <div class="hdr-title" id="hdrTitle">Field journal</div>
        <div class="hdr-sub" id="hdrSub">Plan · ride · remember</div>
      </div>
      <div class="hdr-right" id="hdrRight">

    <nav id="nav" aria-label="Primary navigation">

        <button class="nav-btn active" data-tab="trips">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M3 6h18M3 12h18M3 18h12"/>

          <span>Trips</span>
        </button>
        <button class="nav-btn" data-tab="archive">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
