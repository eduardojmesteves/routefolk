map $http_x_forwarded_proto $routefolk_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name _;

  location = /health { return 200 'routefolk backend gateway ok\n'; add_header Content-Type text/plain; }
  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $routefolk_forwarded_proto;
  }
  location /rest/v1/ { proxy_pass http://rest:3000/; proxy_set_header Host $host; }
  location /storage/v1/ { proxy_pass http://storage:5000/; proxy_set_header Host $host; }
  location /agent/v1/ { proxy_pass http://agent-api:3001/; proxy_set_header Host $host; }
  location / { return 404; }
}
