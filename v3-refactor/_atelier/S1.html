<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S1 · costs breakdown — reference render</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --rf-m2-bg:#e7e4d8;--rf-m2-surface:#f3f0e4;--rf-m2-ink:#171a26;--rf-m2-ink-2:#3b405a;--rf-m2-muted:#787a8a;
    --rf-m2-rule:rgba(23,26,38,.10);--rf-m2-primary:#26345e;--rf-m2-accent:#b85a2e;
    --rf-d2-bg:#e7e4d8;--rf-d2-surface:#f3f0e4;--rf-d2-ink:#171a26;--rf-d2-muted:#787a8a;
    --rf-d2-rule:rgba(23,26,38,.10);--rf-d2-rule-2:rgba(23,26,38,.20);--rf-d2-primary:#26345e;--rf-d2-accent:#b85a2e;
    --rf-m2-font-ui:'Inter Tight',system-ui,sans-serif;--rf-m2-font-serif:'Newsreader',Georgia,serif;--rf-m2-font-mono:'IBM Plex Mono',monospace;
    --rf-d2-font-ui:'Inter Tight',system-ui,sans-serif;--rf-d2-font-serif:'Newsreader',Georgia,serif;--rf-d2-font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--rf-m2-bg);font-family:var(--rf-m2-font-ui);color:var(--rf-m2-ink);padding:26px;display:flex;gap:30px;align-items:flex-start}
  .col{display:flex;flex-direction:column;gap:10px}
  .col.m{width:330px}.col.d{width:300px}
  .cap{font:600 9px var(--rf-m2-font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--rf-m2-accent);margin-bottom:2px}
  .surfacelabel{font:italic 13px var(--rf-m2-font-serif);color:var(--rf-m2-muted)}

  /* S1 mobile */
  .rf-clean-breakdown{background:var(--rf-m2-surface);border:1px solid var(--rf-m2-rule);border-radius:6px;padding:10px 12px}
  .rf-clean-breakdown>strong{display:block;font:700 10px var(--rf-m2-font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--rf-m2-ink);margin-bottom:6px}
  .rf-clean-breakdown .br-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:4px 0 2px;font:13px var(--rf-m2-font-serif);color:var(--rf-m2-ink-2)}
  .rf-clean-breakdown .br-row b{font:600 13px var(--rf-m2-font-serif);color:var(--rf-m2-ink)}
  .rf-clean-breakdown .bar{height:4px;background:var(--rf-m2-bg);border-radius:999px;margin:0 0 6px;overflow:hidden}
  .rf-clean-breakdown .bar>i{display:block;height:100%;background:var(--rf-m2-primary);border-radius:999px}
  .rf-clean-breakdown.is-payer .bar>i{background:var(--rf-m2-accent)}

  /* S1 desktop (existing card + new bar) */
  .rf-d2-section-title{font:500 15px var(--rf-d2-font-serif);margin:6px 0 2px}
  .rf-d2-breakdown{border:1px solid var(--rf-d2-rule);background:rgba(243,240,228,.45);border-radius:4px;padding:12px 16px}
  .rf-d2-break-row{display:flex;justify-content:space-between;font:16px var(--rf-d2-font-serif);padding:8px 0 4px}
  .rf-d2-break-row strong{font-weight:500}
  .rf-d2-breakdown .bar{height:3px;background:var(--rf-d2-rule);border-radius:999px;margin:2px 0 8px;overflow:hidden}
  .rf-d2-breakdown .bar>i{display:block;height:100%;background:var(--rf-d2-primary);border-radius:999px}
  .rf-d2-breakdown.is-payer .bar>i{background:var(--rf-d2-accent)}
  .old{opacity:.92}
  .strike{text-decoration:line-through;color:var(--rf-d2-muted);font:600 9px var(--rf-m2-font-mono);letter-spacing:.12em}
</style>
</head>
<body>
  <div class="col m">
    <div class="cap">📱 mobile · costs tab (new)</div>
    <section class="rf-clean-breakdown">
      <strong>By category</strong>
      <div class="br-row"><span>Fuel</span><b>€120</b></div><div class="bar"><i style="width:100%"></i></div>
      <div class="br-row"><span>Food &amp; drink</span><b>€60</b></div><div class="bar"><i style="width:50%"></i></div>
      <div class="br-row"><span>Tolls</span><b>€30</b></div><div class="bar"><i style="width:25%"></i></div>
    </section>
    <section class="rf-clean-breakdown is-payer">
      <strong>By payer</strong>
      <div class="br-row"><span>Eduardo</span><b>€140</b></div><div class="bar"><i style="width:100%"></i></div>
      <div class="br-row"><span>Marta</span><b>€70</b></div><div class="bar"><i style="width:50%"></i></div>
    </section>
  </div>

  <div class="col d">
    <div class="cap">🖥 desktop · aside (add bar)</div>
    <div class="rf-d2-section-title">By category</div>
    <div class="rf-d2-breakdown">
      <div class="rf-d2-break-row"><span>Fuel</span><strong>€120</strong></div><div class="bar"><i style="width:100%"></i></div>
      <div class="rf-d2-break-row"><span>Food &amp; drink</span><strong>€60</strong></div><div class="bar"><i style="width:50%"></i></div>
      <div class="rf-d2-break-row"><span>Tolls</span><strong>€30</strong></div><div class="bar"><i style="width:25%"></i></div>
    </div>
    <div class="rf-d2-section-title">By payer</div>
    <div class="rf-d2-breakdown is-payer">
      <div class="rf-d2-break-row"><span>Eduardo</span><strong>€140</strong></div><div class="bar"><i style="width:100%"></i></div>
      <div class="rf-d2-break-row"><span>Marta</span><strong>€70</strong></div><div class="bar"><i style="width:50%"></i></div>
    </div>
    <div class="strike">today: same rows, no bars</div>
  </div>
</body>
</html>
