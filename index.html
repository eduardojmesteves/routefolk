  <style id="rf-mobile-wizard-field-fix">
    @media(max-width:959px){
      .rf-v2-wizard-host.is-mobile,
      .rf-v2-wizard-host.is-mobile .rf-v2-wizard-panel,
      .rf-v2-wizard-host.is-mobile .rf-d2-form-row,
      .rf-v2-wizard-host.is-mobile .rf-d2-form-row-pair{
        touch-action:auto!important;
      }
      .rf-v2-wizard-host.is-mobile .rf-d2-input,
      .rf-v2-wizard-host.is-mobile .rf-d2-textarea,
      .rf-v2-wizard-host.is-mobile select.rf-d2-input,
      .rf-v2-wizard-host.is-mobile input[type="date"].rf-d2-input,
      .rf-v2-wizard-host.is-mobile input[type="time"].rf-d2-input{
        pointer-events:auto!important;
        touch-action:manipulation!important;
        -webkit-user-select:text!important;
        user-select:text!important;
      }
      .rf-v2-wizard-host.is-mobile input[type="date"].rf-d2-input,
      .rf-v2-wizard-host.is-mobile input[type="time"].rf-d2-input,
      .rf-v2-wizard-host.is-mobile select.rf-d2-input{
        height:48px!important;
        min-height:48px!important;
        max-height:48px!important;
        padding:0 14px!important;
        line-height:48px!important;
        box-sizing:border-box!important;
      }
      .rf-v2-wizard-host.is-mobile input[type="date"].rf-d2-input,
      .rf-v2-wizard-host.is-mobile input[type="time"].rf-d2-input{
        appearance:none!important;
        -webkit-appearance:none!important;
      }
      .rf-v2-wizard-host.is-mobile select.rf-d2-input{
        appearance:auto!important;
        -webkit-appearance:menulist!important;
      }
      .rf-v2-wizard-host.is-mobile input[type="date"].rf-d2-input::-webkit-date-and-time-value,
      .rf-v2-wizard-host.is-mobile input[type="time"].rf-d2-input::-webkit-date-and-time-value{
        min-height:0!important;
        text-align:left!important;
      }
    }
  </style>
