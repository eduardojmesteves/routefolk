<!DOCTYPE html>
<html lang="en-GB" data-palette="midnight">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#171a26">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="routefolk">
  <meta name="description" content="Plan, journal, and archive motorcycle trips with friends.">
  <meta name="color-scheme" content="light">
  <title>routefolk</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260516-redesign-ink-rust-01">
  <link rel="stylesheet" href="style-fidelity.css?v=20260516-fidelity-01">
  <link rel="stylesheet" href="styles/v2-shell.css?v=20260516-v2-shell-01">
  <link rel="stylesheet" href="styles/v2-integration.css?v=20260516-v2-shell-01">
  <link rel="stylesheet" href="styles/v2-cleanup.css?v=20260516-v2-shell-02">
  <link rel="stylesheet" href="styles/v2-wizards.css?v=20260516-v2-wizards-02">
</head>
<body>
  <a class="skip-link" href="#content">Skip to main content</a>
  <div class="rf-app" id="app">
    <main class="rf-screen" id="content" tabindex="-1" aria-live="polite"></main>
  </div>
  <div id="toast" aria-live="polite" aria-atomic="true"></div>
  <button class="rf-paletteFab" id="rf-paletteFab" aria-label="Change palette" type="button">
    <span class="rf-paletteFab__dot rf-paletteFab__dot--primary"></span>
    <span class="rf-paletteFab__dot rf-paletteFab__dot--accent"></span>
  </button>
  <div class="rf-paletteSheet" id="rf-paletteSheet" hidden>
    <div class="rf-paletteSheet__kicker">Palette</div>
    <div class="rf-paletteSheet__title">Field journal · colours</div>
    <div class="rf-paletteSheet__list">
      <button class="rf-paletteOpt" data-palette="midnight" type="button">
        <span class="rf-paletteOpt__swatch" style="--a:#26345e;--b:#b85a2e;--c:#e7e4d8"></span>
        <span class="rf-paletteOpt__name">Ink &amp; Rust</span>
        <span class="rf-paletteOpt__sub">Cool cream · ink · rust</span>
      </button>
      <button class="rf-paletteOpt" data-palette="forest" type="button">
        <span class="rf-paletteOpt__swatch" style="--a:#355d3f;--b:#b3823a;--c:#ebe5d3"></span>
        <span class="rf-paletteOpt__name">Forest &amp; Ochre</span>
        <span class="rf-paletteOpt__sub">Warm cream · forest · ochre</span>
      </button>
      <button class="rf-paletteOpt" data-palette="oxblood" type="button">
        <span class="rf-paletteOpt__swatch" style="--a:#566970;--b:#8a4554;--c:#ece7df"></span>
        <span class="rf-paletteOpt__name">Slate &amp; Bordeaux</span>
        <span class="rf-paletteOpt__sub">Warm white · slate · bordeaux</span>
      </button>
      <button class="rf-paletteOpt" data-palette="alpine" type="button">
        <span class="rf-paletteOpt__swatch" style="--a:#2c3133;--b:#c69842;--c:#e9e6dd"></span>
        <span class="rf-paletteOpt__name">Graphite &amp; Sun</span>
        <span class="rf-paletteOpt__sub">Soft beige · graphite · sun</span>
      </button>
    </div>
  </div>
  <script>
    try {
      if (!localStorage.getItem('rf.palette')) localStorage.setItem('rf.palette', 'midnight');
    } catch {}
  </script>
  <script src="screens/v2/v2-app.js?v=20260516-v2-shell-01" type="module"></script>
  <script src="screens/v2/v2-wizards.js?v=20260516-v2-wizards-02" type="module"></script>
  <script src="screens/v2/v2-actions.js?v=20260516-v2-shell-01" type="module"></script>
  <script src="app-v2.js?v=20260516-v2-app-01" type="module"></script>
</body>
</html>
